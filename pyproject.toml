[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-transfer-demo"
version = "0.1.0"
description = "CPU-only staged KV-cache transfers with paged storage and numerical checks"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6"]

[tool.setuptools.packages.find]
where = ["src"]
